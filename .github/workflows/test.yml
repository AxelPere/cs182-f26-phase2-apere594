name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fixed-input tests
        run: python3 run_tests.py fixed

      - name: Bug-finding tests
        if: always()
        run: python3 run_tests.py bugs

      - name: Random testing baseline
        if: always()
        run: python3 run_tests.py random
